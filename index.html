    <script>
      // Graceful error catcher and console hygiene filter for browser extensions, iframe observers, Monaco editor, CSP reports, and dev-server reloads
      (function() {
        const suppressedPatterns = [
          'startTime',
          'reportAllChanges',
          'Intervention',
          'preloaded using link preload',
          'Origin trial controlled feature',
          'Failed to load module script',
          'WebSocket connection to',
          'requestAdapter() on Windows',
          'No ID or name found in config',
          'JetskiLog',
          'Content Security Policy',
          'violates the following Content Security Policy',
          'The policy is report-only',
          'Creating a worker from',
          'worker.js',
          'monaco',
          'editor.main.js',
          'analytics.google.com',
          'google-analytics.com',
          'g/collect',
          'ERR_QUIC_PROTOCOL_ERROR',
          'QUIC_TOO_MANY_RTOS',
          'net::ERR_',
          'Unrecognized feature',
          '413',
          'status of 413',
        ];

        function shouldSuppress(msg) {
          if (!msg) return false;
          const text = String(msg);
          return suppressedPatterns.some(function(pattern) {
            return text.includes(pattern);
          });
        }

        // Catch CSP report-only violation events
        window.addEventListener('securitypolicyviolation', function(event) {
          if (event && (shouldSuppress(event.blockedURI) || shouldSuppress(event.violatedDirective) || shouldSuppress(event.originalPolicy))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function (event) {
          if (event && (shouldSuppress(event.message) || shouldSuppress(event.filename))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (event && (shouldSuppress(event.reason) || shouldSuppress(event.reason && event.reason.message))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Filter all console streams (warn, error, log, info, debug) for benign iframe and extension noise
        ['warn', 'error', 'log', 'info', 'debug'].forEach(function(level) {
          const original = console[level];
          if (!original) return;
          console[level] = function() {
            const args = Array.prototype.slice.call(arguments);
            const shouldDrop = args.some(function(arg) {
              return shouldSuppress(arg != null ? String(arg) : '');
            });
            if (shouldDrop) return;
            original.apply(console, args);
          };
        });
      })();
    </script>
