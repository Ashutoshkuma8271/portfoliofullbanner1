  <body class="bg-[#131314] text-[#e5e2e3] antialiased selection:bg-[#d4af37] selection:text-[#131314]">
    <script>
      // Graceful error catcher for browser extensions and performance observer interventions
      window.addEventListener('error', function (event) {
        if (event && event.message && (event.message.includes('startTime') || event.message.includes('reportAllChanges') || event.message.includes('Intervention'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && String(event.reason).includes('startTime')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;color:#f5f2eb;">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <div style="position:absolute;inset:0;border-radius:50%;border:1px solid rgba(212,175,55,0.25);"></div>
          <div style="position:absolute;inset:0;border-radius:50%;border-top:2px solid #f2ca50;border-right:1px solid #f2ca50;border-bottom:transparent;border-left:transparent;animation:initialSpin 2.4s linear infinite;"></div>
          <img src="/zeenat_kureshi_monogram_dark.png" alt="Zeenat Kureshi Monogram" style="width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 16px rgba(212,175,55,0.35);" />
        </div>
        <div style="font-size:16px;letter-spacing:4px;text-transform:uppercase;color:#f5f2eb;font-weight:500;margin-bottom:6px;">Zeenat Kureshi</div>
        <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#d4af37;font-weight:600;">Sovereign Executive Folio</div>
        <style>
          @keyframes initialSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
